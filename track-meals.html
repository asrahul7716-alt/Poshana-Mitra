<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Meals - Poshana Mitra</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Poshana Mitra</h1>
            <div class="user-info">
                <span id="user-name">Welcome, User</span>
                <button id="logout-btn">Logout</button>
            </div>
            <div class="language-toggle">
                <button id="lang-en">English</button>
                <button id="lang-kn">ಕನ್ನಡ</button>
            </div>
        </header>
        <main>
            <nav class="sidebar">
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="meal-planner.html">Meal Planner</a></li>
                    <li><a href="track-meals.html" class="active">Track Meals</a></li>
                </ul>
            </nav>
            <div class="main-content">
                <section class="meal-tracking-form">
                    <h2>Log Today's Meals</h2>
                    <div class="child-info">
                        <label for="child-select-track">Select Child:</label>
                        <select id="child-select-track">
                            <option value="">-- Select a child --</option>
                        </select>
                    </div>
                    <div class="date-info">
                        <label for="date-select">Date:</label>
                        <input type="date" id="date-select" value="">
                    </div>
                    <div class="meal-times">
                        <div class="meal-time" data-time="breakfast">
                            <h3>Breakfast</h3>
                            <div class="food-items">
                                <!-- Food items will be dynamically generated -->
                            </div>
                        </div>
                        <div class="meal-time" data-time="lunch">
                            <h3>Lunch</h3>
                            <div class="food-items">
                                <!-- Food items will be dynamically generated -->
                            </div>
                        </div>
                        <div class="meal-time" data-time="snack">
                            <h3>Snack</h3>
                            <div class="food-items">
                                <!-- Food items will be dynamically generated -->
                            </div>
                        </div>
                        <div class="meal-time" data-time="dinner">
                            <h3>Dinner</h3>
                            <div class="food-items">
                                <!-- Food items will be dynamically generated -->
                            </div>
                        </div>
                    </div>
                    <button id="save-meal-log-btn">Save Meal Log</button>
                </section>
            </div>
        </main>
        <footer>
            <p>&copy; 2026 Poshana Mitra. All rights reserved.</p>
        </footer>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/language.js"></script>
    <script src="js/main.js"></script>
    <script src="js/track-meals.js"></script>
    <script src="js/init.js"></script>
</body>
</html>
