<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner - Poshana Mitra</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Poshana Mitra</h1>
            <div class="user-info">
                <span id="user-name">Welcome, User</span>
                <button id="logout-btn">Logout</button>
            </div>
            <div class="language-toggle">
                <button id="lang-en">English</button>
                <button id="lang-kn">ಕನ್ನಡ</button>
            </div>
        </header>
        <main>
            <nav class="sidebar">
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="meal-planner.html" class="active">Meal Planner</a></li>
                    <li><a href="track-meals.html">Track Meals</a></li>
                </ul>
            </nav>
            <div class="main-content">
                <section class="meal-planner-form">
                    <h2>Weekly Meal Planner</h2>
                    <div class="child-info">
                        <label for="child-select">Select Child:</label>
                        <select id="child-select">
                            <option value="">-- Select a child --</option>
                            <!-- Options will be populated dynamically -->
                        </select>
                    </div>
                    <div class="plan-controls">
                        <button id="generate-plan-btn">Generate Weekly Plan</button>
                        <button id="print-plan-btn">Print Plan</button>
                    </div>
                    <div id="meal-planner-output">
                        <!-- Meal plan will be displayed here -->
                    </div>
                </section>
            </div>
        </main>
        <footer>
            <p>&copy; 2026 Poshana Mitra. All rights reserved.</p>
        </footer>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/language.js"></script>
    <script src="js/main.js"></script>
    <script src="js/meal-planner.js"></script>
    <script src="js/init.js"></script>
</body>
</html>
