<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poshana Mitra - Diet & Nutrition Awareness</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Poshana Mitra</h1>
            <div class="language-toggle">
                <button id="lang-en">English</button>
                <button id="lang-kn">ಕನ್ನಡ</button>
            </div>
        </header>
        <main>
            <section class="login-form">
                <h2>Login to Your Account</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Username or Email</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="remember-me">
                            Remember me
                        </label>
                    </div>
                    <button type="submit">Login</button>
                </form>
                <p class="dont-have-account">
                    Don't have an account? <a href="#" id="show-register">Register here</a>
                </p>
                <p class="forgot-password">
                    <a href="#" id="show-forgot-password">Forgot password?</a>
                </p>
            </section>
        </main>
        <footer>
            <p>&copy; 2026 Poshana Mitra. All rights reserved.</p>
        </footer>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/language.js"></script>
    <script src="js/main.js"></script>
    <script src="js/init.js"></script>
</body>
</html>
